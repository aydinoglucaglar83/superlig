name: CORS test (gecici)
on:
  push:
    branches: [main]
    paths: [".github/workflows/cors-test.yml"]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U="https://site.api.espn.com/apis/site/v2/sports/soccer/tur.1/scoreboard?dates=20261123"
          E=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$U")
          echo "=== ESPN direct 200"; curl -s -D - -o /dev/null --compressed -H "Origin: https://aydinoglucaglar83.github.io" "$U" | grep -iE "^HTTP|access-control|cache-control|age:|vary"
          echo "=== ESPN preflight-ish (with Accept)"; curl -s -D - -o /dev/null --compressed -H "Origin: https://aydinoglucaglar83.github.io" -H "Accept: */*" "$U" | grep -iE "^HTTP|access-control"
          echo "=== site.web.api"; curl -s -D - -o /dev/null --compressed -H "Origin: https://aydinoglucaglar83.github.io" "https://site.web.api.espn.com/apis/site/v2/sports/soccer/tur.1/scoreboard?dates=20261123" | grep -iE "^HTTP|access-control"
          for P in "https://api.allorigins.win/raw?url=$E" "https://corsproxy.io/?url=$E" "https://api.codetabs.com/v1/proxy?quest=$E"; do
            echo "=== $P" | cut -c1-60; curl -s -m 20 -D - -o b.txt --compressed -H "Origin: https://aydinoglucaglar83.github.io" "$P" | grep -iE "^HTTP|access-control-allow-origin"; head -c 120 b.txt; echo
          done
