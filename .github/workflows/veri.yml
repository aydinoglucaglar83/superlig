name: Veri guncelle
# football-data.co.uk CSV'lerini her 3 saatte bir indirip data/ klasörüne koyar.
# Uygulama veriyi kendi sitesinden okur; CORS proxy'ye gerek kalmaz.
on:
  schedule:
    # Her saat (GitHub planlı görevleri bazen atlıyor; sık çalışma bunu telafi eder)
    - cron: "17 * * * *"
    # Salı ve Cuma öğleden sonra (UTC 12–21) yarım saatte bir ek çalışma: maç öncesi oranlar bu saatlerde eklenir
    - cron: "47 12-21 * * 2,5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/veri.yml"]
permissions:
  contents: write
concurrency:
  group: veri
  cancel-in-progress: false
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CSV indir
        run: |
          set -u
          BASE="https://www.football-data.co.uk"
          Y=$(date -u +%Y); M=$((10#$(date -u +%m)))
          if [ "$M" -ge 7 ]; then S=$Y; else S=$((Y-1)); fi
          kod() { printf "%02d%02d" $(( $1 % 100 )) $(( ($1 + 1) % 100 )); }
          CUR=$(kod $S); PREV=$(kod $((S-1))); PREV2=$(kod $((S-2)))
          indir() { # $1 yol  $2 beklenen başlık
            tmp=$(mktemp)
            if curl -fsSL --retry 3 --max-time 60 -A "Mozilla/5.0" "$BASE/$1" -o "$tmp" \
               && head -c 40 "$tmp" | sed 's/^\xEF\xBB\xBF//' | grep -q "^$2"; then
              mkdir -p "data/$(dirname "$1")"; mv "$tmp" "data/$1"; echo "ok  $1"
            else rm -f "$tmp"; echo "yok $1"; fi
          }
          DIVS="T1 E0 SP1 I1 D1 F1 N1 P1 B1 G1 E1 E2 E3 EC SC0 SC1 SC2 SC3 D2 I2 SP2 F2"
          for d in $DIVS; do
            indir "mmz4281/$CUR/$d.csv" "Div,"
            [ -f "data/mmz4281/$PREV/$d.csv" ] || indir "mmz4281/$PREV/$d.csv" "Div,"
            [ "$M" -ge 7 ] && [ "$M" -le 9 ] && { [ -f "data/mmz4281/$PREV2/$d.csv" ] || indir "mmz4281/$PREV2/$d.csv" "Div,"; }
          done
          indir "fixtures.csv" "Div,"
          for x in ARG AUT BRA CHN DNK FIN IRL JPN MEX NOR POL ROU RUS SWE SWZ USA; do indir "new/$x.csv" "Country,"; done
      - name: Commit
        run: |
          git config user.name "veri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "degisiklik yok"; exit 0; fi
          git commit -m "Veri guncellemesi $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main && git push
